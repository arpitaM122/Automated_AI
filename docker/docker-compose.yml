version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai-workflow-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ai-workflow-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.1
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
